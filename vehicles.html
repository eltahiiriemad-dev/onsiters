<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onsiters — Vehicles</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const content = renderShell("vehicles", "Vehicles");
      if (!content) return;

      const vehicles = await loadData("vehicles.json");
      const cases = await loadData("cases.json");
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (id) {
        renderDetail(id);
      } else {
        renderList();
      }

      function renderList() {
        content.innerHTML = `
          <p class="lede">Fictional demo vehicle records used to illustrate the Onsiters vehicle database. No real registrations.</p>
          <div class="record-list" id="vehicleList"></div>
        `;
        document.getElementById("vehicleList").innerHTML = vehicles
          .map(
            (v) => `
          <a class="record-row" href="vehicles.html?id=${encodeURIComponent(v.id)}">
            <div class="record-main">
              <div class="id">${v.id}</div>
              <div class="title">${v.year} ${v.make} ${v.model}</div>
              <div class="sub">${v.color} · ${v.registration}</div>
            </div>
            <span class="link-arrow">VIEW →</span>
          </a>`
          )
          .join("");
      }

      function renderDetail(vehicleId) {
        const v = vehicles.find((x) => x.id === vehicleId);
        if (!v) {
          content.innerHTML = `
            <a class="back-link" href="vehicles.html">← Back to vehicles</a>
            <div class="search-empty">No vehicle found with ID ${vehicleId}.</div>`;
          return;
        }

        const relatedCase = cases.find((c) => c.id === v.relatedCase);

        content.innerHTML = `
          <a class="back-link" href="vehicles.html">← Back to vehicles</a>
          <div class="detail-card">
            <div class="id">${v.id}</div>
            <h3>${v.year} ${v.make} ${v.model}</h3>
            <div class="detail-grid">
              <div><div class="k">COLOR</div><div class="v">${v.color}</div></div>
              <div><div class="k">REGISTRATION</div><div class="v">${v.registration}</div></div>
              <div><div class="k">YEAR</div><div class="v">${v.year}</div></div>
              <div><div class="k">VEHICLE ID</div><div class="v">${v.id}</div></div>
            </div>
          </div>

          <div class="result-group-label">RELATED CASE</div>
          <div class="record-list" id="relatedCase">
            ${
              relatedCase
                ? `
              <a class="record-row" href="cases.html?id=${encodeURIComponent(relatedCase.id)}">
                <div class="record-main">
                  <div class="id">${relatedCase.id}</div>
                  <div class="title">${relatedCase.title}</div>
                  <div class="sub">${relatedCase.category} · ${relatedCase.location} · ${relatedCase.date}</div>
                </div>
                <span class="pill ${statusClass(relatedCase.status)}">${relatedCase.status}</span>
                <span class="link-arrow">VIEW →</span>
              </a>`
                : `<div class="search-empty">No related case on file for this vehicle.</div>`
            }
          </div>
        `;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onsiters — About</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const content = renderShell("about", "About");
      if (!content) return;

      content.innerHTML = `
        <div class="about-block">
          <p>Onsiters is a small, self-contained demo interface built to look like an open-source
          investigation portal. It runs entirely in your browser — there is no server, no database,
          and no account system behind it.</p>

          <h3>How it works</h3>
          <p>Every screen reads from plain JSON files stored in the <code>data/</code> folder:
          fictional users, people, cases, and vehicles. Nothing is sent anywhere, and nothing is
          saved after you close the tab, aside from your login session for that browsing session.</p>

          <h3>What it is not</h3>
          <p>Onsiters does not represent, impersonate, or connect to any real police department,
          government agency, or law-enforcement database. It provides no real security, encryption,
          or investigative access of any kind. "SYSTEM ONLINE" and "SECURE SESSION" are cosmetic,
          atmosphere-only labels, not real status indicators.</p>

          <h3>Editing the demo data</h3>
          <p>To change what shows up in the dashboard, open the files in <code>data/</code> and edit
          the entries directly, or add new ones following the same structure. Comments in the
          JavaScript files under <code>js/</code> point to where each dataset is used.</p>

          <div class="disclaimer-box">
            Onsiters is a fictional OSINT training/demo interface. All records and identities
            displayed on this website are fictional.
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onsiters — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-topline">
      <span id="loginSessionId">SES-0912</span>
      <span>09-12</span>
    </div>

    <div class="login-card">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 6C29 6 14 21 14 42c0 13 6 22 13 28v10c0 3 2 5 5 5h4v-9h5v9h9v-9h5v9h4c3 0 5-2 5-5V70c7-6 13-15 13-28C86 21 71 6 50 6Z"
            fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <ellipse cx="34" cy="40" rx="8" ry="10" fill="currentColor" opacity="0.9"/>
          <ellipse cx="66" cy="40" rx="8" ry="10" fill="currentColor" opacity="0.9"/>
          <path d="M50 48v10l-5 5h10l-5-5Z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M36 70h28M40 70v5M45 70v6M50 70v7M55 70v6M60 70v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="login-mark"></div>
      <h1>WELCOME TO ONSITERS</h1>
      <p class="subtitle">Open Source Investigation Network</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="off" />
        </div>
        <div class="field">
          <label for="accessCode">Access Code</label>
          <input id="accessCode" type="password" autocomplete="off" />
        </div>
        <button class="login-btn" type="submit">Log in</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
